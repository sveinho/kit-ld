<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Module Batch Editor</title>

            display: flex;
            flex-direction: column;

        }
        .container {

            display: flex;
            flex-direction: column;
            flex-grow: 1;
            box-sizing: border-box;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #edf2f7;

            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;

            font-weight: 600;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }
        .btn:hover { background-color: #2b6cb0; }
        .btn-save { background-color: #38a169; }
        .btn-save:hover { background-color: #2f855a; }
        .btn-danger { background-color: #e53e3e; }
        .btn-danger:hover { background-color: #c53030; }
        
        /* Layout med modulvelger i sidepanel */
        .main-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            flex-grow: 1;
        }
        
        .sidebar {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .module-list {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .module-item {
            padding: 10px;
            background: #fff;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .module-item:hover { background: #edf2f7; }
        .module-item.active {
            background: #ebf8ff;
            border-color: #3182ce;
            color: #2b6cb0;
            font-weight: 600;
        }
        
        .editor-area {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
